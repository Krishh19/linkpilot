name: Feature request
description: Suggest a routing, cleaning, browser, or UI improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        LinkPilot is intentionally offline and permission-light. Requests that
        require network access, an Accessibility Service, or broad package
        visibility are unlikely to be accepted. Explain the user problem first.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow that does not work today.
      placeholder: I want links from my work chat to open in a separate browser profile.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should LinkPilot do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds, other apps, or Android settings you tried.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rule matching
        - Browser routing
        - Picker
        - Default-browser setup
        - Tracker cleaning
        - History / backup
        - UI / accessibility
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: privacy
    attributes:
      label: Privacy and platform impact
      description: Does this require network access, new permissions, background work, clipboard access, or an Accessibility Service?
      placeholder: No new permissions; it only changes rule matching.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I understand that Android cannot target browser profiles or intercept hard-coded WebViews through public APIs.
          required: true
